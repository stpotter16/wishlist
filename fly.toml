# fly.toml app configuration file generated for app-wishlist on 2026-10-23T09:07:58-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'app-wishlist'
primary_region = 'iad'

[build]

[env]
  WISHLIST_DB_PATH = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
