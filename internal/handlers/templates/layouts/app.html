{{ define "content" }}
  <main
    class="{{ block "main-width" . }}max-w-lg{{ end }} mx-auto px-4 pt-4 pb-24"
  >
    {{ block "page-content" . }}{{ end }}
  </main>
  <nav
    class="fixed inset-x-0 bottom-0 flex h-16 items-stretch border-t border-border bg-page"
  >
    <a
      href="/admin"
      class="flex flex-1 flex-col items-center justify-center gap-1 {{ if eq .ActivePage "dashboard" }}
        text-accent
      {{ else }}
        text-muted hover:text-fg
      {{ end }}"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="size-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
        />
      </svg>
      <span class="text-xs">Dashboard</span>
    </a>
    <button
      id="logout"
      type="button"
      class="flex flex-1 flex-col items-center justify-center gap-1 text-muted hover:text-fg disabled:opacity-50"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="size-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
        />
      </svg>
      <span class="text-xs">Log out</span>
    </button>
  </nav>
  <script type="module" nonce="{{ .CspNonce }}">
    const logout = document.getElementById("logout");
    logout.addEventListener("click", () => {
      logout.disabled = true;
      fetch("/logout", {
        method: "POST",
        mode: "same-origin",
        credentials: "include",
        cache: "no-cache",
        redirect: "error",
      }).finally(() => {
        // Whether or not the session was still valid, the admin wants out.
        document.location = "/login";
      });
    });
  </script>
{{ end }}
