{{ define "title" }}Login{{ end }}
{{ define "script-tags" }}
  <script type="module" nonce="{{ .CspNonce }}">
    const loginForm = document.getElementById("login");

    function setLoginFormState(isEnabled) {
      document.querySelectorAll("#login input").forEach((el) => {
        el.disabled = !isEnabled;
      });
    }

    function disableLoginForm() {
      setLoginFormState(false);
    }

    function enableLoginForm() {
      setLoginFormState(true);
    }

    async function login(username, password) {
      return fetch("/login", {
        method: "POST",
        mode: "same-origin",
        credentials: "include",
        cache: "no-cache",
        redirect: "error",
        body: JSON.stringify({
          username: username,
          password: password,
        }),
      }).then((response) => {
        if (!response.ok) {
          return response.text().then((error) => {
            return Promise.reject(error);
          });
        }
        return Promise.resolve();
      });
    }

    document.getElementById("error-close").addEventListener("click", () => {
      document.getElementById("error-message").classList.add("hidden");
      document.getElementById("password").value = "";
    });

    loginForm.addEventListener("submit", (evt) => {
      evt.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      disableLoginForm();
      login(username, password)
        .then(() => {
          document.location = "/";
        })
        .catch((error) => {
          enableLoginForm();
          document.getElementById("error-text").textContent = error;
          document.getElementById("error-message").classList.remove("hidden");
        });
    });
  </script>
{{ end }}
{{ define "content" }}
  <div class="flex min-h-screen items-center justify-center px-4">
    <div class="flex w-full max-w-sm flex-col items-center gap-6">
      <h1 class="text-3xl font-bold">Coin</h1>
      <div class="w-full rounded-xl bg-surface p-6 shadow-sm">
        <div id="error-message" class="mb-4 hidden" role="alert">
          <div
            class="flex items-center gap-2 rounded-lg bg-danger-surface px-4 py-3 text-sm text-danger"
          >
            <span id="error-text"></span>
            <button
              id="error-close"
              type="button"
              aria-label="Dismiss"
              class="ml-auto rounded-md px-2 text-lg leading-none hover:bg-danger/10"
            >
              &times;
            </button>
          </div>
        </div>
        <form id="login" class="flex flex-col gap-4">
          <div>
            <label for="username" class="mb-1 block text-sm font-semibold"
              >Username</label
            >
            <input
              class="w-full rounded-lg border border-border bg-page px-3 py-2 text-sm focus:border-accent focus:outline-2 focus:outline-accent/30 disabled:opacity-50"
              type="text"
              name="username"
              id="username"
              autocomplete="username"
            />
          </div>
          <div>
            <label for="password" class="mb-1 block text-sm font-semibold"
              >Password</label
            >
            <input
              class="w-full rounded-lg border border-border bg-page px-3 py-2 text-sm focus:border-accent focus:outline-2 focus:outline-accent/30 disabled:opacity-50"
              type="password"
              name="password"
              id="password"
              autocomplete="current-password"
            />
          </div>
          <button
            type="submit"
            class="inline-flex items-center justify-center rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-on-accent hover:bg-accent-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:opacity-50 w-full"
          >
            Login
          </button>
        </form>
      </div>
    </div>
  </div>
{{ end }}
